[MOSE-Parameters]
iter-threshold = 500000
newrun = true

[MOSE-Multigrid]
levels = 3
level1-iter = 20000
level2-iter = 20000
level3-iter = 100000

[MOSE-IO]
ic-format = tecplot binary
sol-diter = 1000

[MOSE-Physics]
equations = navier-stokes
chemistry = finite-rate
turbulence = SA
schmidt = 0.7

[MOSE-Turbulence]
Sct = 0.7

[MOSE-Chemistry]
ode-solver = H-radau5
ode-absolute-tol-species = 1e-12 1e-12 1e-12 1e-12 1e-12 1e-12 1e-12 1e-12 1e-12
ode-relative-tol-species = 1e-8 1e-8 1e-8 1e-8 1e-8 1e-8 1e-8 1e-8 1e-8
ode-absolute-tol-temperature = 1e-4
ode-relative-tol-temperature = 1e-8
ode-max-steps = 100000

[MOSE-Numerics]
cfl = 0.8
cfl-rise-threshold = 5000
vnn = 0.5
time-accurate = false
time-scheme = RK2
irs-beta = 0.5
integration-variables = cons
riemann-solver = HLLC
space-reconstruction = MUSCL
flux-limiter = vanleer

[MOSE-Probes]
probe1 = probe

[probe]
index-location = 2 1 1 1
diter = 5
variables = T

; ATLAS ICB sections to build ic.szplt starting from the MESH/mesh.szplt and phase data in INPUT
[ATLAS-Parameters]
IC-format = tec binary

[ICB-Block*]
alpha = 0.0
beta = 0.0
mach = 2.49
p = 130.2e3
T = 1377
yN2 = 0.7686
yO2 = 0.2314
mit = 1.0e-6
 
[ICB-Block6]
direction = z
range1 = -10.0 0.0 -1e30 1e30 -1e30 1e30
zone1 = hydroIC
range2 = 0.0 10.0 -1e30 1e30 -1e30 1e30
zone2 = airIC
 
[ICB-Block7]
direction = z
range1 = -10.0 0.0 -1e30 1e30 -1e30 1e30
zone1 = hydroIC
range2 = 0.0 10.0 -1e30 1e30 -1e30 1e30
zone2 = airIC
 
[ICB-Block8]
direction = z
range1 = -10.0 0.0 -1e30 1e30 -1e30 1e30
zone1 = hydroIC
range2 = 0.0 10.0 -1e30 1e30 -1e30 1e30
zone2 = airIC
 
[ICB-Block9]
direction = z
range1 = -10.0 0.0 -1e30 1e30 -1e30 1e30
zone1 = hydroIC
range2 = 0.0 10.0 -1e30 1e30 -1e30 1e30
zone2 = airIC

[airIC]
alpha = 0.0
beta = 0.0
mach = 2.49
p = 130.2e3
T = 1377
yN2 = 0.7686
yO2 = 0.2314
mit = 1.0e-6
 
; choked porthole state, consistent with the hydrogen BC mass flux of 297.134 kg/m2/s
; at T0 of 300 K: sonic H2 has gamma 1.4157, so T* is 248.4 K and a* is 1204.2 m/s
[hydroIC]
T = 248.4
p = 252.8e3
w = 1204.2
yH2 = 1.0
mit = 1.0e-6
