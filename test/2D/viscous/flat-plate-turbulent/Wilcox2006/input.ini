[MOSE-Parameters]
iter-threshold = 100000

[MOSE-Physics]
equations  = navier-stokes
turbulence = Wilcox2006

[MOSE-Numerics]
cfl                   = 1.0
vnn                   = 1.0
time-scheme           = RK3
time-accurate         = false
irs-beta              = 0.5
riemann-solver        = HLLC
flux-limiter          = vanleer
space-reconstruction  = MUSCL
integration-variables = cons

[MOSE-IO]
sol-diter   = 2000
shell-diter = 100
ini-diter   = 200


; End of MOSE setup

[GRIB-meshgen]
method = p3d
type = 2Dplane
inputfile = MESH/flatplate-coarse.p3d

[GPB-Phase1]
type = ideal-gas
species = air
gamma = 1.4
R = 287.0
mil = 1.1858685985e-5
Pr = 0.72

[ICB-Block1]
type = homogeneous
p0 = 1.02828d+5
T = 555.0
mach = 0.2
kappa = 2.25d-3
omega = 6250.0

[BCB-Block1]
face1 = inflow
face2 = outflow
face3 = wall
face4 = symmetry

[wall]
direction = x
patch1 = symmetry
range1 = -0.333 0.
patch2 = adiabatic
range2 = 0. 2.

[inflow]
type = inlet
g = 59.2934299
T = 555.0
kappa = 2.25d-3
omega = 6250.0

[outflow]
type = outlet
p = 1.0d+5

[adiabatic]
type = wall
q = 0.0
