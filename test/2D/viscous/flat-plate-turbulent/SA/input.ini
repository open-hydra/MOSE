[MOSE-Parameters]
iter-threshold = 200000
newrun = false

[MOSE-Physics]
equations  = navier-stokes
turbulence = SA

[MOSE-Numerics]
cfl                   = 0.8
vnn                   = 0.3
time-scheme           = RK3
time-accurate         = false
irs-beta              = 0.5
riemann-solver        = AUSM+
flux-limiter          = vanleer
space-reconstruction  = MUSCL
integration-variables = cons

[MOSE-IO]
sol-diter   = 2000
shell-diter = 100
ini-diter   = 200

; End of MOSE setup

[GRIB-meshgen]
method = p3d
type = 2Dplane
inputfile = MESH/flatplate.p3d

[GPB-Phase1]
type = ideal-gas
species = air
gamma = 1.4
R = 287.0
mil = 1.1858685985e-5
Pr = 0.72

[ICB-Block1]
type = homogeneous
p0 = 1.02828d+5
T = 555.
mach = 0.2
mit = 1d-6

[BCB-Block1]
face1 = inflow
face2 = outflow
face3 = wall
face4 = symmetry

[wall]
direction = x
patch1 = symmetry
range1 = -0.333 0.
patch2 = adiabatic
range2 = 0. 2.

[inflow]
type = inlet
g = 59.2934299
T = 555.0
mit = 1d-6

[outflow]
type = outlet
p = 1.0d+5

[adiabatic]
type = wall
q = 0.0
