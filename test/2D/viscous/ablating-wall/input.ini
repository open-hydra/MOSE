[MOSE-Parameters]
iter-threshold = 4000
newrun         = true

[MOSE-Physics]
equations = navier-stokes
prandtl   = 1.0
schmidt   = 1.0

[MOSE-Numerics]
cfl                   = 0.5
vnn                   = 0.5
time-accurate         = false
time-scheme           = RK2
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = HLLC

[MOSE-IO]
sol-diter      = 1000000000
shell-diter    = 2000
ini-diter      = 1000000000
wall-variables = mech thermal mass
