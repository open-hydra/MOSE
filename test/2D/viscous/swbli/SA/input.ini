[MOSE-Multigrid]
levels = 4
level1-iter = 100000
level2-iter = 5000
level3-iter = 5000
level4-iter = 10000

[MOSE-Physics]
equations  = navier-stokes
turbulence = SA

[MOSE-Numerics]
cfl                   = 1.0
cfl-rise-threshold    = 1000
vnn                   = 0.1
time-scheme           = RK3
time-accurate         = false
irs-beta              = 0.5
riemann-solver        = HLLC
flux-limiter          = vanleer
space-reconstruction  = MUSCL
integration-variables = cons

[MOSE-IO]
sol-diter = 2000
shell-diter = 100
ini-diter = 200
ic-format = tecplot binary

;


; GPB writes phase.txt and thermo.dat. transport.dat is not a GPB product: it is the
; Sutherland table of test/common/Air-sutherland (As 1.458e-6, Ts 110.4, Eucken conductivity)
[GPB-Phase1]
type = ideal-gas
species = air
gamma = 1.4
R = 287.0
Pr = 0.69

[ATLAS-Parameters]
MG-levels = 4
IC-format = tec-binary

[ICB-Block*]
p = 0.04d+5
T = 68.3
mach = 5.0
nuTilde = 4.9005e-6

[BCB-Block1]
face1 = inflow
face2 = outlet
face3 = isothermal
face4 = connection

[BCB-Block2]
face1 = inflow
face2 = outlet
face3 = connection
face4 = connection

[BCB-Block3]
face1 = inflow
face2 = outlet
face3 = connection
face4 = up

[up]
direction = x
patch1 = symmetry
range1 = -2.0 0.0
patch2 = isothermal
range2 = 0.0 2.0

[inflow]
type = inlet
mach = 5.0
T = 68.3
p = 0.04d+5
nuTilde = 4.9005e-6

[isothermal]
type = wall
T = 300.0

[GRIB-meshgen]
method = gmsh
inputfile = MESH/script.geo
type = 2Dplane

[GRIB-Block1]
list = 1

[GRIB-Block2]
list = 3 4 5

[GRIB-Block3]
list = 2
