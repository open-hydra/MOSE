[MOSE-Parameters]
; MOSE.sh sets the number of iterations of the form: a few hundred for the short form, which checks
; the mirror symmetry of the solution, up to the residual threshold for the full form
newrun         = true
res-threshold  = 1.0e-8
iter-threshold = 200000

[MOSE-Physics]
equations  = navier-stokes
turbulence = SA
prandtl    = 0.72

[MOSE-Turbulence]
Prt = 0.9

[MOSE-Numerics]
cfl                   = 0.8
vnn                   = 0.3
time-scheme           = RK3
time-accurate         = false
irs-beta              = 0.0
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = HLLC

[MOSE-IO]
sol-diter     = 1000000000
shell-diter   = 1000
res-diter     = 10
ini-diter     = 1000000000

; INPUT/ic.tec and INPUT/bc.txt are written by make_case.py before each run
