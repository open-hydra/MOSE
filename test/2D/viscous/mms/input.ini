[MOSE-Parameters]
; steady manufactured field held by the analytic source; march to a converged
; residual with local time stepping
res-threshold  = 1.0e-9
iter-threshold = 100000

[MOSE-Physics]
equations = navier-stokes
; laminar Prandtl fixes k as mu*cp/Pr (matches the baked kcond in mms.f90)
prandtl = 0.72
; positive Schmidt selects the constant-Schmidt mass-diffusion path (single
; species -> zero mass flux; avoids needing a binary-diffusion table)
schmidt = 1.0

[MOSE-Numerics]
time-accurate         = false
time-scheme           = RK3
integration-variables = cons
; conservative cfl and vnn: with elevated viscosity the RK3 2D-diffusion limit is tight
cfl                   = 0.2
cfl-rise-threshold    = 0
vnn                   = 0.1
riemann-solver        = HLLC
flux-limiter          = vanleer
space-reconstruction  = MUSCL

[MOSE-IO]
sol-diter   = 1000000
shell-diter = 5000
res-diter   = 100

; ICs are built by build_ic.py; the manufactured source is injected by MOSE_mms

[GRIB-meshgen]
type=2Dplane

[GRIB-Block1]
method = fmsh
pivot = 0.0 0.0
length = 1.0
height = 1.0
nx = 64
ny = 64

[BCB-Block1]
face1 = per
face2 = per
face3 = per2
face4 = per2

[per]
type = periodic
faces = 1 2

[per2]
type = periodic
faces = 3 4
