[MOSE-Parameters]
; steady manufactured fields held by the analytic source; march with local time
; stepping until the residual has fallen by 5e-4 from the first iteration: the
; errors are then within about 1 % of their converged values on these grids
res-threshold  = 5.0e-4
iter-threshold = 400000

[MOSE-Physics]
equations = navier-stokes
; laminar Prandtl fixes k as mu*cp/Pr (matches the constant of the sources in mms.f90)
prandtl = 0.72
; single species: the constant-Schmidt path gives zero mass diffusion
schmidt = 1.0

[MOSE-Numerics]
time-accurate         = false
time-scheme           = RK3
integration-variables = cons
; the cfl and vnn of the Cartesian case (../input.ini)
cfl                   = 0.2
cfl-rise-threshold    = 0
vnn                   = 0.1
riemann-solver        = HLLC
flux-limiter          = vanleer
space-reconstruction  = MUSCL

[MOSE-IO]
sol-diter   = 1000000
shell-diter = 5000
res-diter   = 100

; INPUT/ic.tec and INPUT/bc.txt are written by make_case.py before each run;
; the manufactured source is injected by MOSE_mms
