; Turbulent flat plate of the NASA TMR, SA. MOSE.sh copies this file to the folder of each run,
; with iter-threshold, newrun and sol-diter of the form: the full form runs 300 000 iterations from
; the uniform field with a numbered solution every 20 000 (the last three and the final one give the
; iterative error), the short form restarts from the converged solution in reference/.
[MOSE-Parameters]
iter-threshold = 300000
newrun = true

[MOSE-Physics]
equations  = navier-stokes
turbulence = SA
prandtl    = 0.72

[MOSE-Turbulence]
Prt = 0.9

[MOSE-Numerics]
cfl                   = 0.8
vnn                   = 0.3
time-scheme           = RK3
time-accurate         = false
irs-beta              = 0.5
riemann-solver        = AUSM+
flux-limiter          = vanleer
space-reconstruction  = MUSCL
integration-variables = cons

[MOSE-IO]
sol-overwrite = false
sol-diter   = 20000
shell-diter = 100
ini-diter   = 200
