[MOSE-Parameters]
iter-threshold = 7000
time-threshold = 2.0

[MOSE-Physics]
equations = euler

[MOSE-Numerics]
time-accurate = false
time-scheme = RK3
integration-variables = cons
cfl = 0.2
cfl-rise-threshold = 0
irs-beta = 0.0
preconditioning-Mach = 0.001
riemann-options-Minf = 0.001
space-reconstruction = MUSCL
flux-limiter = vanleer
riemann-solver = AUSM+M

[MOSE-IO]
sol-diter = 1000
shell-diter = 10

[MOSE-Probes]
probe1 = pressure

[pressure]
variables = u
diter = 10
index-position = 1 75 1 1

; End of solver input

; ICs are built by build_ic.py

[GRIB-meshgen]
type=2Dplane

[GRIB-Block1]
method = fmsh
pivot = 0.0 0.0
length = 0.8
height = 0.8
nx = 80
ny = 80

[BCB-Block1]
face1 = extrapolation
face2 = extrapolation
face3 = extrapolation
face4 = extrapolation
