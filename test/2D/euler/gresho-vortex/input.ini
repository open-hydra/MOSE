[MOSE-Parameters]
time-threshold = 1.0

[MOSE-Physics]
equations = euler

[MOSE-Numerics]
time-accurate = true
time-scheme = RK3
integration-variables = cons
cfl = 0.6
riemann-options-Mco = 0.005
space-reconstruction = first-order
riemann-solver = AUSM+M

[MOSE-IO]
sol-diter = 5000
shell-diter = 100

[MOSE-Probes]
probe1 = pressure

[pressure]
variables = u
diter = 10
index-position = 1 75 1 1

; End of solver input

; ICs are built by build_ic.py

[GRIB-meshgen]
type=2Dplane

[GRIB-Block1]
method = fmsh
pivot = 0.0 0.0
length = 1.0
height = 1.0
nx = 100
ny = 100

[BCB-Block1]
face1 = per
face2 = per
face3 = per2
face4 = per2

[per]
type = periodic
faces = 1 2

[per2]
type = periodic
faces = 3 4
