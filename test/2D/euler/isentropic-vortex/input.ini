[MOSE-Parameters]
; one convective period at unit mean flow over the box
time-threshold = 10.0

[MOSE-Physics]
equations = euler

[MOSE-Numerics]
time-accurate = true
time-scheme = RK3
integration-variables = cons
cfl = 0.5
space-reconstruction = MUSCL
flux-limiter = vanleer
riemann-solver = HLLC

[MOSE-IO]
sol-diter = 1000000
shell-diter = 200

; ICs are built by build_ic.py

[GRIB-meshgen]
type=2Dplane

[GRIB-Block1]
method = fmsh
pivot = 0.0 0.0
length = 10.0
height = 10.0
nx = 64
ny = 64

[BCB-Block1]
face1 = per
face2 = per
face3 = per2
face4 = per2

[per]
type = periodic
faces = 1 2

[per2]
type = periodic
faces = 3 4
