[MOSE-Parameters]
iter-threshold = 1000000

[MOSE-Multigrid]
levels = 5
level1-iter = 100000
level2-iter = 200000
level3-iter = 400000
level4-iter = 800000
level5-iter = 1000000

[MOSE-IO]
shell-diter = 100
sol-diter = 1000
sol-overwrite = true

[MOSE-Physics]
equations = navier-stokes
chemistry = finite-rate
schmidt = 0.7
prandtl = 0.7

[MOSE-Chemistry]
ode-solver = ros4

[MOSE-Numerics]
cfl                   = 0.9
cfl-rise-threshold    = 0
time-accurate         = true
time-scheme           = RK2
integration-variables = cons
irs-beta              = 0.0
space-reconstruction  = MUSCL
flux-limiter          = vanalbada
riemann-solver        = HLLC

[MOSE-Probes]
probe1 = probe

[probe]
index-position = 1 80 1 1
variables = T u
diter = 10

[GPB-Phase1]
phase = ZK
Tmax = 5000

[GRIB-meshgen]
method = fmsh
type = 2Dplane

[GRIB-Block1]
pivot = 0.0 0.0 0.0
length = 300d-3
height = 1d-2
nx = 4000
ny = 1
strx = I 4.0

[ATLAS-Parameters]
MG-levels = 5

[BCB-Block1]
face1 = inflow
face2 = outflow
face3 = symmetry
face4 = symmetry

