[MOSE-Parameters]
iter-threshold = 30000
newrun = true

[MOSE-IO]
shell-diter = 100
sol-diter = 1000
sol-overwrite = true

[MOSE-Physics]
equations = navier-stokes
chemistry = finite-rate

[MOSE-Chemistry]
ode-solver = sdirk4b

[MOSE-Numerics]
cfl                   = 0.5
time-accurate         = true
time-scheme           = RK2
integration-variables = cons
irs-beta              = 0.0
space-reconstruction  = MUSCL
flux-limiter          = minmod
riemann-solver        = LMRoe

[MOSE-Probes]
probe1 = probe

[probe]
index-position = 1 80 1 1
variables = T p
diter = 10

[GPB-Phase1]
phase = ZK
Tmax = 15000

[GRIB-meshgen]
method = fmsh
type = 2Dplane

[GRIB-Block1]
pivot = 0.0 0.0 0.0
length = 300d-3
height = 1d-2
nx = 100
ny = 1

[BCB-Block1]
face1 = inflow
face2 = outflow
face3 = symmetry
face4 = symmetry

[inflow]
