[MOSE-Parameters]
time-threshold = 0.200
newrun = true

[MOSE-IO]
shell-diter = 100
sol-dtime = 0.050
sol-overwrite = false

[MOSE-Physics]
equations = navier-stokes

[MOSE-Numerics]
cfl                   = 0.95
vnn                   = 0.95
time-accurate         = true
time-scheme           = RK2
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = HLLC

[GPB-Phase1]
species = O2 N2 H2O CH4
Tmax = 5000
transport = cantera

[GRIB-meshgen]
method = fmsh
type = 2Dplane

[GRIB-Block1]
pivot = 0.0 0.0 0.0
length = 0.05
height = 1d-2
nx = 200
ny = 1

[BCB-Block1]
face1 = per
face2 = per
face3 = symmetry
face4 = symmetry

[per]
type = periodic
faces = 1 2