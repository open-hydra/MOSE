name: CTest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # The verifier scripts import pyplot unconditionally; keep them headless.
  MPLBACKEND: Agg

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The submodules of MOSE, without recursion. Of the submodules of
          # FLINT the build uses only OSLO, fetched by the next step: FLINT's
          # own ORION is not built, as MOSE builds its ORION, and Cantera
          # (whose submodule Eigen is hosted on gitlab.com) and SUNDIALS are
          # built only with USE_CANTERA=ON or USE_SUNDIALS=ON.
          submodules: true

      - name: Fetch OSLO, the submodule of FLINT that the build uses
        run: git -C lib/FLINT submodule update --init --depth 1 lib/OSLO

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        # ExactPack is not on PyPI; it is published only from LANL's GitHub.
        # Pin the tag so the verification baseline cannot shift without a
        # commit here. scipy arrives as an ExactPack dependency.
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib sympy \
            "ExactPack @ git+https://github.com/lanl/ExactPack.git@1.7.11"

      - name: Check Python dependencies
        run: |
          python -c "import numpy, scipy, matplotlib, sympy, exactpack; print('exactpack', exactpack.__version__)"

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=TESTING \
            -DCMAKE_Fortran_COMPILER=gfortran \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DUSE_OPENMP=ON \
            -DUSE_MPI=OFF \
            -DUSE_TECIO=OFF \
            -DUSE_SUNDIALS=OFF \
            -DUSE_CANTERA=OFF

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run tests
        # Exclude cases that need heavy/optional dependencies disabled in this build
        # (Cantera, SUNDIALS, MPI) and the full forms of the verification cases
        # (label verification), which run on request. See test/TESTING-PLAN.md
        # for the tiering.
        run: >
          ctest --test-dir build --output-on-failure --timeout 300
          --label-exclude "needs-cantera|needs-sundials|needs-mpi|verification"

  test-mpi:
    # gfortran with the MPI library of Ubuntu (Open MPI): the build with
    # USE_MPI=ON and the needs-mpi tier, which the job above does not register.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The submodules that the build uses, as in the job above.
          submodules: true

      - name: Fetch OSLO, the submodule of FLINT that the build uses
        run: git -C lib/FLINT submodule update --init --depth 1 lib/OSLO

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libopenmpi-dev openmpi-bin

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib sympy \
            "ExactPack @ git+https://github.com/lanl/ExactPack.git@1.7.11"

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=TESTING \
            -DCMAKE_Fortran_COMPILER=gfortran \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DUSE_OPENMP=ON \
            -DUSE_MPI=ON \
            -DUSE_TECIO=OFF \
            -DUSE_SUNDIALS=OFF \
            -DUSE_CANTERA=OFF

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run MPI tests
        # Up to 4 ranks per test: let Open MPI run more ranks than the runner
        # has cores (Open MPI 4 and Open MPI 5 read different variables).
        env:
          OMPI_MCA_rmaps_base_oversubscribe: "1"
          PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"
        run: >
          ctest --test-dir build --output-on-failure --timeout 900
          --label-regex needs-mpi --no-tests=error
