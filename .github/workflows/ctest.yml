name: CTest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # The verifier scripts import pyplot unconditionally; keep them headless.
  MPLBACKEND: Agg

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        # ExactPack is not on PyPI; it is published only from LANL's GitHub.
        # Pin the tag so the verification baseline cannot shift without a
        # commit here. scipy arrives as an ExactPack dependency.
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib sympy \
            "ExactPack @ git+https://github.com/lanl/ExactPack.git@1.7.11"

      - name: Check Python dependencies
        run: |
          python -c "import numpy, scipy, matplotlib, sympy, exactpack; print('exactpack', exactpack.__version__)"

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=TESTING \
            -DCMAKE_Fortran_COMPILER=gfortran \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DUSE_OPENMP=ON \
            -DUSE_MPI=OFF \
            -DUSE_TECIO=OFF \
            -DUSE_SUNDIALS=OFF \
            -DUSE_CANTERA=OFF

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run tests
        # Exclude cases that need heavy/optional dependencies disabled in this build
        # (Cantera, SUNDIALS, MPI). See test/TESTING-PLAN.md for the tiering.
        run: >
          ctest --test-dir build --output-on-failure --timeout 300
          --label-exclude "needs-cantera|needs-sundials|needs-mpi"
