name: Documentation

# The documentation site, built with Zensical from mkdocs.yml (requirements-docs.txt): built, in strict mode, on every
# pull request that changes it, and published to GitHub Pages on every push to main
on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push to the same pull request cancels the build of the previous one
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install Zensical
        run: pip install -r requirements-docs.txt

      # Strict: a warning, such as a broken link, fails the build
      - name: Build the site
        run: zensical build --strict

      # Zensical (0.0.74) does not report a link that starts with '/', which would leave
      # https://open-hydra.github.io/MOSE/ on the published site (mkdocs.yml asks MkDocs to)
      - name: No absolute links
        run: |
          if grep -rnE '\]\(/[^/]' docs --include='*.md'; then
            echo "Absolute links leave https://open-hydra.github.io/MOSE/: write them relative to the page"
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
